
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090909">
<title>DARK MUSCLE PRO</title>
<style>
:root{--bg:#090909;--panel:#131313;--panel2:#191919;--red:#ed2029;--muted:#929292;--line:#292929;--white:#f4f4f4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--white);font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.app{max-width:1400px;margin:auto;min-height:100vh}
header{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;background:#090909f2;z-index:5}
.brand{font-weight:950;letter-spacing:1.4px;font-size:19px}.brand span{color:var(--red)}
.brand small{display:block;font-size:9px;color:#999;letter-spacing:4px}
.pill{border:1px solid #3a1719;color:#ff686d;background:#211012;border-radius:30px;padding:7px 12px;font-size:11px;font-weight:800}
.layout{display:grid;grid-template-columns:215px minmax(0,1fr);min-height:calc(100vh - 76px)}
aside{padding:25px 14px;border-right:1px solid var(--line)}
.navlabel{color:#686868;font-size:10px;font-weight:800;letter-spacing:2px;padding:10px}
.nav{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;color:#aaa;border:0;padding:13px 12px;border-radius:9px;margin:3px 0}
.nav.active,.nav:hover{background:#251012;color:#fff}.nav.active{box-shadow:inset 3px 0 var(--red)}
main{padding:28px;min-width:0}
.eyebrow{color:var(--red);font-weight:900;letter-spacing:2px;font-size:10px}
h1{font-size:clamp(26px,4vw,39px);line-height:1.12;margin:7px 0 8px;letter-spacing:-1px}
h2{font-size:18px;margin:0 0 14px}h3{font-size:14px;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 23px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin:20px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:18px;min-width:0}
.statlabel{font-size:11px;color:#999}.stat{font-size:29px;font-weight:900;margin:8px 0 2px;letter-spacing:-1px}.stat span{font-size:12px;color:#888;letter-spacing:0}
.red{color:var(--red)}.muted{color:var(--muted)}.small{font-size:12px}
.hero{border:1px solid #401518;background:linear-gradient(120deg,#241012,#111 65%);padding:25px;border-radius:15px;display:flex;justify-content:space-between;align-items:center;gap:20px}
.hero h2{font-size:24px;margin:6px 0}.hero p{color:#bbb;margin:0}
.btn{border:0;background:var(--red);color:white;padding:11px 15px;border-radius:8px;font-weight:850}
.btn:hover{background:#ff3942}.btn.secondary{background:#242424;border:1px solid #393939}.btn.danger{background:#321214;border:1px solid #652025}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.section{margin-top:25px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.exercise{padding:15px 0;border-bottom:1px solid var(--line)}.exercise:last-child{border-bottom:0}
.exname{font-weight:800}.tag{font-size:10px;border:1px solid #393939;border-radius:5px;padding:3px 7px;color:#aaa}
input,select{background:#0d0d0d;color:#eee;border:1px solid #363636;padding:10px;border-radius:7px;width:100%;min-width:0}
label{display:block;font-size:11px;color:#aaa;margin-bottom:6px}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{margin-bottom:13px}.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:#999;font-weight:700}td input{width:76px;padding:8px}
.empty{padding:25px 10px;text-align:center;color:#777}
.progress{height:6px;background:#2a2a2a;border-radius:10px;overflow:hidden;margin-top:10px}
.progress div{height:100%;background:var(--red);width:0}
.bottomnav{display:none}
footer{color:#555;text-align:center;padding:25px;font-size:10px;letter-spacing:1px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#252525;border:1px solid #444;padding:12px 18px;border-radius:9px;z-index:20;display:none}
@media(max-width:850px){.layout{grid-template-columns:1fr}aside{display:none}main{padding:20px 15px 90px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}header{padding:0 15px;height:66px}.hero{align-items:flex-start;flex-direction:column}.bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#101010;border-top:1px solid #333;z-index:10;justify-content:space-around;padding:8px 2px calc(8px + env(safe-area-inset-bottom))}.bottomnav button{border:0;background:none;color:#aaa;font-size:10px;padding:5px}.bottomnav button.active{color:#ff454d}.bottomnav span{display:block;font-size:18px}.stat{font-size:25px}}
@media(max-width:390px){.formgrid{grid-template-columns:1fr}.grid{gap:9px}.card{padding:13px}}

/* DARK MUSCLE PRO — DASHBOARD UPGRADE */
.dashboard-hero {
  position: relative;
  overflow: hidden;
  min-height: 210px;
  background:
    radial-gradient(ellipse at 90% 15%, #581317 0, transparent 42%),
    linear-gradient(125deg, #211012, #111 65%);
  border: 1px solid #512025;
  border-radius: 17px;
  padding: 27px;
}

.dashboard-hero::after {
  content: "DM";
  position: absolute;
  right: 18px;
  bottom: -45px;
  font-size: 155px;
  line-height: 1;
  font-weight: 1000;
  font-style: italic;
  color: #ffffff08;
  pointer-events: none;
}

.dashboard-hero h2 {
  font-size: clamp(24px, 4vw, 36px);
  letter-spacing: -1px;
  margin: 12px 0;
  max-width: 600px;
}

.dashboard-hero p {
  color: #b5b5b5;
  max-width: 480px;
}

.dashboard-hero .btn,
.dashboard-hero .eyebrow,
.dashboard-hero p,
.dashboard-hero h2 {
  position: relative;
  z-index: 1;
}

.dashboard-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 13px;
  margin: 18px 0;
}

.dashboard-stat {
  background: linear-gradient(145deg, #181818, #101010);
  border: 1px solid #303030;
  border-radius: 13px;
  padding: 17px;
  min-width: 0;
}

.dashboard-stat .stat {
  font-size: clamp(22px, 2.5vw, 30px);
  overflow-wrap: anywhere;
}

.stat-icon {
  display: flex;
  width: 35px;
  height: 35px;
  align-items: center;
  justify-content: center;
  border-radius: 9px;
  background: #301215;
  color: #ff555d;
  font-size: 17px;
  margin-bottom: 14px;
}

.dashboard-columns {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr);
  gap: 14px;
  margin-top: 16px;
}

.dashboard-panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 19px;
  min-width: 0;
}

.dashboard-panel h2 {
  margin-bottom: 5px;
}

.dashboard-chart {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  height: 150px;
  padding-top: 15px;
}

.chart-day {
  flex: 1;
  min-width: 0;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  gap: 8px;
}

.chart-bar {
  width: min(100%, 34px);
  min-height: 3px;
  background: linear-gradient(180deg, #ff5159, #a80f18);
  border-radius: 5px 5px 2px 2px;
  transition: height .25s ease;
}

.chart-day-label {
  color: #777;
  font-size: 10px;
}

.chart-day-value {
  font-size: 9px;
  color: #aaa;
  text-align: center;
}

.dash-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 13px 0;
  border-bottom: 1px solid var(--line);
}

.dash-item:last-child {
  border-bottom: 0;
}

.dash-item strong {
  display: block;
  overflow-wrap: anywhere;
}

.dash-item .muted {
  font-size: 11px;
}

.dash-badge {
  background: #281114;
  border: 1px solid #4a1a20;
  color: #ff7379;
  padding: 5px 8px;
  border-radius: 6px;
  font-size: 10px;
  font-weight: 800;
  white-space: nowrap;
}

.dash-quick-actions {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  margin-top: 16px;
}

.dash-quick-actions button {
  text-align: left;
  min-height: 85px;
  background: #151515;
  border: 1px solid #303030;
  border-radius: 11px;
  color: #eee;
  padding: 13px;
}

.dash-quick-actions button:hover {
  border-color: #8f252c;
  background: #201012;
}

.dash-quick-actions strong {
  display: block;
  margin-bottom: 5px;
}

.dash-quick-actions span {
  color: #888;
  font-size: 11px;
}

@media(max-width:850px) {
  .dashboard-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .dashboard-columns {
    grid-template-columns: 1fr;
  }

  .dashboard-hero {
    padding: 22px;
  }

  .dash-quick-actions {
    grid-template-columns: 1fr;
  }

  .dash-quick-actions button {
    min-height: 65px;
  }
}

</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">DARK<span> MUSCLE</span><small>PRO TRAINING SYSTEM</small></div>
  <div class="pill">● SISTEMA PERSONAL</div>
</header>
<div class="layout">
<aside>
  <div class="navlabel">CENTRO DE CONTROL</div>
  <button class="nav active" data-page="home">◈ &nbsp; Dashboard</button>
  <button class="nav" data-page="workout">▤ &nbsp; Entrenamiento</button>
  <button class="nav" data-page="history">◷ &nbsp; Historial</button>
  <button class="nav" data-page="ranks">◆ &nbsp; Rangos</button>
  <button class="nav" data-page="body">◎ &nbsp; Seguimiento corporal</button>
  <button class="nav" data-page="profile">⚙ &nbsp; Perfil y datos</button>
  <div class="card" style="margin-top:28px">
    <div class="eyebrow">DISCIPLINA</div>
    <p style="font-weight:800;margin-bottom:5px">Cada serie cuenta.</p>
    <p class="muted small" style="margin:0">Registra. Progresa. Repite.</p>
  </div>
</aside>
<main id="main"></main>
</div>
<nav class="bottomnav">
  <button data-page="home" class="active"><span>◈</span>Inicio</button>
  <button data-page="workout"><span>▤</span>Entrenar</button>
  <button data-page="history"><span>◷</span>Historial</button>
  <button data-page="ranks"><span>◆</span>Rangos</button>
  <button data-page="body"><span>◎</span>Progreso</button>
</nav>
<footer>DARK MUSCLE PRO · BUILD 0.1 · ENTRENA CON INTENCIÓN</footer>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
"use strict";
const KEY="dmt-pro-test-v1";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const defaults=()=>({
version:1,profile:{name:"",weight:79.8,height:184,goal:"Hipertrofia",level:"Intermedio"},
sessions:[],measurements:[],routine:[
{name:"Press de banca",muscle:"Pecho",sets:3,reps:8},
{name:"Press inclinado con mancuernas",muscle:"Pecho",sets:3,reps:10},
{name:"Jalón al pecho",muscle:"Espalda",sets:3,reps:10},
{name:"Elevaciones laterales",muscle:"Hombros",sets:3,reps:15},
{name:"Curl de bíceps",muscle:"Bíceps",sets:3,reps:12},
{name:"Extensión de tríceps en polea",muscle:"Tríceps",sets:3,reps:12},
{name:"Sentadilla",muscle:"Cuádriceps",sets:3,reps:8},
{name:"Peso muerto rumano",muscle:"Isquios",sets:3,reps:10}
]});
let data;
try{const raw=localStorage.getItem(KEY);data=raw?JSON.parse(raw):defaults();if(!data||data.version!==1)throw Error("Formato");}
catch(e){data=defaults();}
let page="home",activeSession=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){notify("No se pudo guardar. Comprueba el almacenamiento del navegador.");return false}}
function notify(s){const t=$("#toast");t.textContent=s;t.style.display="block";clearTimeout(notify.timer);notify.timer=setTimeout(()=>t.style.display="none",2400)}
function go(p){page=p;render();document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===p));window.scrollTo({top:0,behavior:"smooth"})}
document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.page)));
function title(kicker,title,desc){return `<div class="eyebrow">${kicker}</div><h1>${title}</h1><p class="sub">${desc}</p>`}
function card(label,value,unit,foot=""){return `<div class="card"><div class="statlabel">${label}</div><div class="stat">${value} <span>${unit}</span></div><div class="muted small">${foot}</div></div>`}
function sessions(){return [...data.sessions].sort((a,b)=>b.date.localeCompare(a.date))}
function completedSets(s){return (s.exercises||[]).reduce((n,e)=>n+(e.sets||[]).filter(x=>Number(x.kg)>0&&Number(x.reps)>0).length,0)}
function totalVolume(s){return (s.exercises||[]).reduce((n,e)=>n+(e.sets||[]).reduce((v,x)=>v+(Number(x.kg)||0)*(Number(x.reps)||0),0),0)}

function home() {
  const ss = sessions();
  const last = ss[0];

  const now = new Date();
  const start = new Date(now);
  start.setHours(0, 0, 0, 0);
  start.setDate(start.getDate() - 6);

  const days = Array.from({ length: 7 }, (_, i) => {
    const d = new Date(start);
    d.setDate(start.getDate() + i);
    const date = [
      d.getFullYear(),
      String(d.getMonth() + 1).padStart(2, "0"),
      String(d.getDate()).padStart(2, "0")
    ].join("-");

    return {
      date,
      label: d.toLocaleDateString("es-ES", {
        weekday: "short"
      }).replace(".", ""),
      volume: 0,
      sessions: 0
    };
  });

  const dayMap = Object.fromEntries(
    days.map(day => [day.date, day])
  );

  ss.forEach(session => {
    const day = dayMap[session.date];
    if (!day) return;

    day.volume += totalVolume(session);
    day.sessions += 1;
  });

  const weekVolume = days.reduce(
    (sum, day) => sum + day.volume, 0
  );

  const weekSessions = days.reduce(
    (sum, day) => sum + day.sessions, 0
  );

  const maxVolume = Math.max(
    1, ...days.map(day => day.volume)
  );

  const allSets = ss.reduce(
    (sum, session) => sum + completedSets(session), 0
  );

  const bestByExercise = {};

  ss.forEach(session => {
    (session.exercises || []).forEach(exercise => {
      (exercise.sets || []).forEach(set => {
        const kg = Number(set.kg);
        const reps = Number(set.reps);

        if (
          !Number.isFinite(kg) || kg <= 0 ||
          !Number.isFinite(reps) || reps < 1
        ) return;

        const key = String(exercise.name || "")
          .trim().toLowerCase();

        if (!key) return;

        const score = kg * (1 + reps / 30);
        const previous = bestByExercise[key];

        if (!previous || score > previous.score) {
          bestByExercise[key] = {
            name: exercise.name,
            kg,
            reps,
            score
          };
        }
      });
    });
  });

  const records = Object.values(bestByExercise)
    .sort((a, b) => b.score - a.score)
    .slice(0, 4);

  const weight = Number(data.profile.weight) || 0;
  const name = String(data.profile.name || "").trim();
  const greeting = name ? `, ${esc(name)}` : "";

  const weekChart = days.map(day => `
    <div class="chart-day">
      <div class="chart-day-value">
        ${day.volume > 0
          ? Math.round(day.volume).toLocaleString("es-ES")
          : "—"}
      </div>
      <div class="chart-bar"
        title="${esc(day.date)}: ${Math.round(day.volume)} kg·reps"
        style="height:${day.volume > 0
          ? Math.max(5, day.volume / maxVolume * 100)
          : 3}%">
      </div>
      <div class="chart-day-label">${esc(day.label)}</div>
    </div>
  `).join("");

  const latestExercises = last
    ? (last.exercises || []).slice(0, 4).map(exercise => {
        const valid = (exercise.sets || []).filter(
          set => Number(set.kg) > 0 && Number(set.reps) > 0
        );

        return `
          <div class="dash-item">
            <div>
              <strong>${esc(exercise.name)}</strong>
              <div class="muted">
                ${valid.length} series válidas
              </div>
            </div>
            <span class="dash-badge">
              ${valid.length
                ? Math.max(...valid.map(s => Number(s.kg))) + " kg"
                : "SIN DATOS"}
            </span>
          </div>
        `;
      }).join("")
    : "";

  return `
    <div class="eyebrow">DARK MUSCLE PRO / CONTROL CENTER</div>
    <h1>DASHBOARD<span class="red">.</span></h1>
    <p class="sub">
      Bienvenido${greeting}. Tu trabajo, tus datos y tu progreso.
    </p>

    <section class="dashboard-hero">
      <div class="eyebrow">DISCIPLINA · CONSTANCIA · PROGRESO</div>
      <h2>BUILD YOUR LEGACY.</h2>
      <p>
        No dependas de la motivación. Registra tu trabajo,
        compara tus resultados y construye tu progreso sesión a sesión.
      </p>
      <div class="actions">
        <button class="btn" onclick="startWorkout()">
          ＋ INICIAR ENTRENAMIENTO
        </button>
        <button class="btn secondary" onclick="go('history')">
          VER HISTORIAL
        </button>
      </div>
    </section>

    <div class="dashboard-grid">
      <div class="dashboard-stat">
        <div class="stat-icon">▤</div>
        <div class="statlabel">SESIONES TOTALES</div>
        <div class="stat">${ss.length}</div>
        <div class="muted small">Entrenamientos guardados</div>
      </div>

      <div class="dashboard-stat">
        <div class="stat-icon">↗</div>
        <div class="statlabel">SERIES REGISTRADAS</div>
        <div class="stat">${allSets}</div>
        <div class="muted small">Con carga y repeticiones</div>
      </div>

      <div class="dashboard-stat">
        <div class="stat-icon">⚡</div>
        <div class="statlabel">VOLUMEN · 7 DÍAS</div>
        <div class="stat">
          ${Math.round(weekVolume).toLocaleString("es-ES")}
          <span>kg·reps</span>
        </div>
        <div class="muted small">${weekSessions} sesiones en el periodo</div>
      </div>

      <div class="dashboard-stat">
        <div class="stat-icon">◎</div>
        <div class="statlabel">PESO CORPORAL</div>
        <div class="stat">
          ${weight.toLocaleString("es-ES")}
          <span>kg</span>
        </div>
        <div class="muted small">
          ${esc(data.profile.goal || "Objetivo no definido")}
        </div>
      </div>
    </div>

    <div class="dashboard-columns">
      <section class="dashboard-panel">
        <div class="row">
          <div>
            <h2>Actividad semanal</h2>
            <p class="muted small">Volumen por día · últimos 7 días</p>
          </div>
          <span class="dash-badge">7 DÍAS</span>
        </div>

        <div class="dashboard-chart">${weekChart}</div>

        <div class="progress">
          <div style="width:${Math.min(
            100, weekSessions / 7 * 100
          )}%"></div>
        </div>

        <p class="muted small">
          El volumen representa carga × repeticiones registradas,
          no una medida directa de crecimiento muscular.
        </p>
      </section>

      <section class="dashboard-panel">
        <div class="row">
          <div>
            <h2>Última sesión</h2>
            <p class="muted small">
              ${last ? esc(last.date) : "Aún sin actividad"}
            </p>
          </div>
          <span class="dash-badge">
            ${last ? "REGISTRADA" : "PENDIENTE"}
          </span>
        </div>

        ${last ? `
          <h3 style="margin-top:16px">
            ${esc(last.name || "Entrenamiento")}
          </h3>
          <p class="muted small">
            ${completedSets(last)} series ·
            ${Math.round(totalVolume(last)).toLocaleString("es-ES")}
            kg·reps
          </p>
          ${latestExercises || `
            <div class="empty">Sesión sin ejercicios detallados.</div>
          `}
          <button class="btn secondary"
            onclick="go('history')">
            CONSULTAR HISTORIAL
          </button>
        ` : `
          <div class="empty">
            Tu primera sesión aparecerá aquí cuando la guardes.
          </div>
          <button class="btn" onclick="startWorkout()">
            EMPEZAR AHORA
          </button>
        `}
      </section>
    </div>

    <section class="dashboard-panel section">
      <div class="row">
        <div>
          <h2>Récords personales</h2>
          <p class="muted small">
            Mejores series registradas por ejercicio
          </p>
        </div>
        <span class="dash-badge">${records.length} EJERCICIOS</span>
      </div>

      ${records.length ? records.map(record => `
        <div class="dash-item">
          <div>
            <strong>${esc(record.name)}</strong>
            <div class="muted">
              ${record.kg} kg × ${record.reps} reps
            </div>
          </div>
          <span class="dash-badge">
            1RM est. ${record.score.toFixed(1)} kg
          </span>
        </div>
      `).join("") : `
        <div class="empty">
          Guarda entrenamientos con peso y repeticiones para
          empezar a construir tu historial de récords.
        </div>
      `}

function previousExercise(name){
 const key=String(name||"").trim().toLowerCase();
 const previous=sessions().find(session=>
  (session.exercises||[]).some(ex=>
   String(ex.name||"").trim().toLowerCase()===key &&
   (ex.sets||[]).some(set=>Number(set.kg)>0&&Number(set.reps)>0)
  )
 );
 if(!previous)return null;
 const exercise=previous.exercises.find(ex=>
  String(ex.name||"").trim().toLowerCase()===key &&
  (ex.sets||[]).some(set=>Number(set.kg)>0&&Number(set.reps)>0)
 );
 if(!exercise)return null;
 return {
  date:previous.date,
  sets:(exercise.sets||[])
   .filter(set=>Number(set.kg)>0&&Number(set.reps)>0)
   .map(set=>({
    kg:Number(set.kg),
    reps:Number(set.reps),
    rir:set.rir
   }))
 };
}
  

function progressionAdvice(previous,currentSets){
 const valid=sets=>(sets||[]).filter(s=>
  Number(s.kg)>0&&Number(s.reps)>0
 );
 const oldSets=valid(previous&&previous.sets);
 const newSets=valid(currentSets);

 if(!oldSets.length){
  return {
   title:"ESTABLECE TU REFERENCIA",
   detail:"Registra tus primeras series válidas para crear una base de progresión."
  };
 }

 if(!newSets.length){
  return {
   title:"REGISTRA TU RENDIMIENTO",
   detail:"Introduce kilos y repeticiones de la sesión actual para comparar tu progreso."
  };
 }

 const avg=(sets,key)=>sets.reduce(
  (sum,s)=>sum+Number(s[key]),0
 )/sets.length;

 const oldKg=avg(oldSets,"kg");
 const newKg=avg(newSets,"kg");
 const oldReps=avg(oldSets,"reps");
 const newReps=avg(newSets,"reps");

 const hasRir=sets=>sets.every(s=>
  s.rir!==""&&s.rir!==null&&s.rir!==undefined&&
  Number.isFinite(Number(s.rir))
 );

 const newRir=hasRir(newSets)?avg(newSets,"rir"):null;

 if(newKg>oldKg&&newReps>=oldReps-0.5){
  return {
   title:"CARGA AUMENTADA",
   detail:"Has utilizado más peso manteniendo las repeticiones medias. Consolida este rendimiento antes de volver a subir."
  };
 }

 if(newKg<oldKg){
  return {
   title:"CONSOLIDA LA CARGA",
   detail:"Has utilizado menos peso. Comprueba si fue intencionado y prioriza una ejecución controlada."
  };
 }

 if(newReps>=oldReps+1){
  if(newRir!==null&&newRir>=2){
   return {
    title:"PROGRESO CONFIRMADO",
    detail:"Has ganado repeticiones y conservas margen. Si cumples el rango previsto con buena técnica, valora el menor incremento disponible."
   };
  }
  return {
   title:"PROGRESA EN REPETICIONES",
   detail:"Has sumado repeticiones. Mantén la carga y confirma el rendimiento con técnica limpia."
  };
 }

 if(newReps<=oldReps-2&&newRir!==null&&newRir<=1){
  return {
   title:"REVISA FATIGA Y EJECUCIÓN",
   detail:"El rendimiento ha caído y el esfuerzo es elevado. Revisa descanso, técnica y recuperación."
  };
 }

 if(newRir!==null&&newRir>=3){
  return {
   title:"VALORA UNA SUBIDA PEQUEÑA",
   detail:"Tienes margen según el RIR registrado. Comprueba que alcanzas el rango previsto antes de aumentar el peso."
  };
 }

 return {
  title:"RENDIMIENTO CONSOLIDADO",
  detail:"El rendimiento es similar al anterior. Mantén la carga e intenta mejorar gradualmente sin sacrificar la técnica."
 };
}

const rankNames = [
  "IRON", "BRONZE", "SILVER", "GOLD", "RUBY",
  "EMERALD", "DIAMOND", "CHAMPION", "SYMMETRIC"
];

function ranks() {
  const best = {};

  data.sessions.forEach(session => {
    (session.exercises || []).forEach(exercise => {
      const valid = (exercise.sets || []).filter(set =>
        Number(set.kg) > 0 &&
        Number(set.reps) >= 1 &&
        Number(set.reps) <= 30
      );

      if (!valid.length) return;

      const bestSet = valid.reduce((best, set) => {
        const kg = Number(set.kg);
        const reps = Number(set.reps);
        const estimated1RM = kg * (1 + reps / 30);

        return !best || estimated1RM > best.estimated1RM
          ? { kg, reps, estimated1RM }
          : best;
      }, null);

      const key = exercise.name.trim().toLowerCase();

      if (
        !best[key] ||
        bestSet.estimated1RM > best[key].estimated1RM
      ) {
        best[key] = {
          name: exercise.name,
          muscle: exercise.muscle || "Sin clasificar",
          estimated1RM: bestSet.estimated1RM,
          kg: bestSet.kg,
          reps: bestSet.reps,
          sessionDate: session.date,
          validSets: valid.length
        };
      }
    });
  });

  const items = Object.values(best);
  const bodyweight = Number(data.profile.weight) || 0;

  function getRank(ratio) {
    const thresholds = [
      0, 0.5, 0.75, 1, 1.25, 1.5, 1.75, 2.1, 2.6
    ];

    let level = 0;

    for (let i = 1; i < thresholds.length; i++) {
      if (ratio >= thresholds[i]) level = i;
    }

    const nextThreshold = thresholds[level + 1];
    const currentThreshold = thresholds[level];
    const divisionProgress = nextThreshold
      ? (ratio - currentThreshold) /
        (nextThreshold - currentThreshold)
      : 1;

    const division = level === 8
      ? ""
      : divisionProgress < 1 / 3
        ? "III"
        : divisionProgress < 2 / 3
          ? "II"
          : "I";

    return {
      level,
      name: rankNames[level],
      division,
      progress: nextThreshold
        ? Math.max(0, Math.min(100, divisionProgress * 100))
        : 100,
      nextThreshold
    };
  }

  const ranked = items.map(exercise => {
    const ratio = bodyweight > 0
      ? exercise.estimated1RM / bodyweight
      : 0;

    return {
      ...exercise,
      ratio,
      rank: getRank(ratio)
    };
  });

  const averageRatio = ranked.length
    ? ranked.reduce((sum, exercise) => sum + exercise.ratio, 0)
      / ranked.length
    : 0;

  const globalRank = getRank(averageRatio);
  const enoughData = ranked.length >= 5;

  return title(
    "PERFORMANCE ENGINE",
    "RANK SYSTEM.",
    "Construye tu nivel ejercicio a ejercicio."
  ) +
  `<div class="hero">
    <div>
      <div class="eyebrow">DARK MUSCLE ATHLETE RANK</div>
      <h2>${enoughData
        ? globalRank.name + (globalRank.division
          ? " " + globalRank.division : "")
        : "UNRANKED"}</h2>
      <p>${ranked.length} ejercicios con registros válidos.</p>
    </div>
    <span class="pill">${enoughData
      ? "NIVEL PROVISIONAL"
      : "DATOS INSUFICIENTES"}</span>
  </div>
  <div class="grid">
    ${card("EJERCICIOS REGISTRADOS", ranked.length, "ejercicios")}
    ${card("PESO CORPORAL", bodyweight.toLocaleString("es-ES"), "kg")}
    ${card("SESIONES", data.sessions.length, "guardadas")}
    ${card("RANGOS", enoughData ? "ACTIVO" : "EN PROGRESO", "")}
  </div>
  <div class="section card">
    <h2>Escala de rangos</h2>
    <p class="muted small">
      Iron → Bronze → Silver → Gold → Ruby → Emerald →
      Diamond → Champion → Symmetric.
      Cada nivel, salvo Symmetric, tiene divisiones III, II y I.
    </p>
    <p class="muted small">
      La puntuación usa una estimación de 1RM dividida por el peso
      corporal. Es un modelo experimental: los ejercicios no son
      directamente comparables y los umbrales no representan
      percentiles reales ni niveles oficiales de Symmetry.
    </p>
  </div>` +
  (ranked.length
    ? ranked
        .sort((a, b) => b.rank.level - a.rank.level ||
          b.ratio - a.ratio)
        .map(exercise => `
          <div class="section card">
            <div class="row">
              <div>
                <div class="eyebrow">${esc(exercise.muscle)}</div>
                <h2>${esc(exercise.name)}</h2>
                <div class="muted small">
                  Mejor serie: ${exercise.kg} kg × ${exercise.reps} reps
                </div>
              </div>
              <span class="pill">
                ${exercise.rank.name}
                ${exercise.rank.division
                  ? " " + exercise.rank.division : ""}
              </span>
            </div>
            <div class="progress">
              <div style="width:${exercise.rank.progress}%"></div>
            </div>
            <p class="muted small">
              1RM estimado: ${exercise.estimated1RM.toFixed(1)} kg ·
              Relación carga/peso corporal:
              ${bodyweight > 0
                ? exercise.ratio.toFixed(2) + "×"
                : "Añade tu peso en Perfil"}
            </p>
          </div>
        `).join("")
    : `<div class="section card empty">
        Registra entrenamientos con peso y repeticiones para
        desbloquear tus primeros rangos.
      </div>`) +
  `<div class="section card">
    <h2>Cómo funciona el progreso</h2>
    <p class="muted small">
      III → II → I → siguiente rango. Registra más sesiones y
      mejora tu rendimiento para actualizar tus resultados.
      El nivel global solo se muestra a partir de cinco ejercicios
      diferentes registrados.
    </p>
  </div>`;
}

$("#main").addEventListener("submit",e=>{if(e.target.id==="measureform"){e.preventDefault();const f=new FormData(e.target);const m={};["date","weight","waist","chest","arm","thigh"].forEach(k=>{const v=f.get(k);m[k]=v===""?null:k==="date"?v:Number(v)});data.measurements.push(m);data.profile.weight=m.weight;save();render();notify("Medición guardada.")}if(e.target.id==="profileform"){e.preventDefault();const f=new FormData(e.target);data.profile={name:String(f.get("name")||""),weight:Number(f.get("weight")),height:Number(f.get("height")),goal:String(f.get("goal")),level:String(f.get("level"))};save();render();notify("Perfil actualizado.")}});
$("#main").addEventListener("change",e=>{if(e.target.id==="importfile"){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const d=JSON.parse(reader.result);if(d.version!==1||!Array.isArray(d.sessions)||!d.profile||!Array.isArray(d.measurements))throw Error();if(!confirm("La importación reemplazará los datos actuales de DARK MUSCLE PRO. ¿Continuar?"))return;data=d;save();render();notify("Copia importada.")}catch(err){notify("Archivo inválido o incompatible.")}};reader.readAsText(file)}});
function render(){const main=$("#main");main.innerHTML=page==="home"?home():page==="workout"?workout():page==="history"?historyPage():page==="ranks"?ranks():page==="body"?bodyPage():profile();document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page))}
render();
})();
</script>
</body>
</html>
